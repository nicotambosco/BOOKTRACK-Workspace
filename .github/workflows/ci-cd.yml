name: CI and Container Delivery

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read
  packages: write

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: booktrack_db
          MYSQL_ROOT_PASSWORD: admin1234
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -padmin1234 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: backend-booktrack
    env:
      SECRET_KEY: ci-booktrack-secret-key-with-enough-length-for-tests
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DB_NAME: booktrack_db
      DB_USER: root
      DB_PASSWORD: admin1234
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend-booktrack/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev pkg-config
      - run: pip install -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BookTrack
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: BookTrack/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  containers:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and deliver backend
        uses: docker/build-push-action@v6
        with:
          context: backend-booktrack
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          tags: |
            ghcr.io/nicotambosco/booktrack-backend:latest
            ghcr.io/nicotambosco/booktrack-backend:${{ github.sha }}
      - name: Build and deliver frontend
        uses: docker/build-push-action@v6
        with:
          context: BookTrack
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          tags: |
            ghcr.io/nicotambosco/booktrack-frontend:latest
            ghcr.io/nicotambosco/booktrack-frontend:${{ github.sha }}
