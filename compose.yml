services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: booktrack_db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Configurá MYSQL_ROOT_PASSWORD en .env}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend-booktrack
    environment:
      SECRET_KEY: ${SECRET_KEY:?Configurá SECRET_KEY en .env}
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      DB_ENGINE: mysql
      DB_NAME: booktrack_db
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Configurá MYSQL_ROOT_PASSWORD en .env}
      DB_HOST: db
      DB_PORT: "3306"
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Configurá ADMIN_PASSWORD en .env}
      STUDENT_PASSWORD: ${STUDENT_PASSWORD:?Configurá STUDENT_PASSWORD en .env}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend-booktrack/media:/app/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/categories/', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  frontend:
    build: ./BookTrack
    ports:
      - "127.0.0.1:4202:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:
