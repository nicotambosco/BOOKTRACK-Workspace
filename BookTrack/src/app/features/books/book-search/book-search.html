<div class="home-page">
  <app-header [esAdmin]="false"></app-header>

  <div class="home-body">
    <div class="main-content">
      <div class="content-header">
        <h2 class="section-title">Resultados</h2>
      </div>

      <div class="bookshelf-card">
        @if (cargando) {
          <p class="msg">Buscando...</p>
        } @else if (libros.length === 0) {
          <div class="empty-state">
            <div class="empty-icon">📖</div>
            <div class="empty-text">
              <h3>No se encontraron libros.</h3>
              <p>Probá con otro título, autor o categoría.</p>
            </div>
          </div>
        } @else {
          <div class="bookshelf">
            @for (libro of libros; track libro.id; let i = $index) {
              <div class="book-card" (click)="irADetalle(libro.id!)">
                <div class="book-cover" [style.background]="colorLibro(i)">
                  <span class="book-title-mini">{{ libro.titulo }}</span>
                </div>
                <div class="book-info">
                  <span class="autor">{{ libro.autor }}</span>
                  <span class="disponibles">{{ libro.disponibles }} disponible/s</span>
                </div>
              </div>
            }
          </div>
        }
      </div>
    </div>
  </div>
</div>
